<!DOCTYPE html>
<html>
    <head>
<style>
    ul{
        list-style-type:circle;
        color:blueviolet;
        font-size:20px;
    }
    ol {
        list-style-type:upper-roman;
        color:green;
        font-size:20px;
    }
        

</style>
    </head>
    <body>
        <h2>unordered list</h2>
        <ul>
            <li>Balu</li>
            <li>Keerthi</li>
            <li>Reshu</li>
            <li>Riyanshi</li>
            <li>siri</li>
        </ul>
        <h2>Ordered List</h2>
        <ol>
            <li>Balu</li>
            <li>Keerthi</li>
            <li>Reshu</li>
            <li>Riyanshi</li>
            <li>siri</li>
        </ol>
    </body>
    </html>
